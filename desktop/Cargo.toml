[package]
name = "kai-ui-desktop-prototype"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
publish = false

[dependencies]
arboard = { version = "3.7.0", default-features = false }
bytemuck = { version = "1.25", features = ["derive"] }
glyphon = "0.12.0"
pollster = "0.4"
cosmic-text = "0.19.0"
taffy = { version = "0.15.0", default-features = false, features = ["std", "taffy_tree", "grid"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "metal", "wgsl"] }
winit = { version = "0.30.12", default-features = false, features = ["rwh_06"] }
