name: release-desktop

on:
  push:
    tags: ["desktop-v*"]

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches crate version
        run: |
          TAG="${GITHUB_REF_NAME#desktop-v}"
          CRATE="$(grep '^version' kai-ui-desktop/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          test "$TAG" = "$CRATE" || { echo "tag desktop-v$TAG != Cargo.toml $CRATE"; exit 1; }
      - run: node scripts/version/check.mjs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kai-ui-desktop
      - name: Build release binary
        working-directory: kai-ui-desktop
        run: cargo build --locked --release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#desktop-v}"
          BIN="kai-ui-desktop/target/release/kai-ui-desktop-prototype"
          if [[ ! -f "$BIN" ]]; then
            BIN="${CARGO_TARGET_DIR:-kai-ui-desktop/target}/release/kai-ui-desktop-prototype"
          fi
          gh release create "$TAG" \
            --title "kai-ui-desktop $VER" \
            --notes-file kai-ui-desktop/CHANGELOG.md \
            "$BIN"
