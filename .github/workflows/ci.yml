name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kai-ui-web/package-lock.json
      - run: node scripts/version/check.mjs
      - run: npm ci --prefix kai-ui-web
      - run: npm run docs:check --prefix kai-ui-web
      - run: npm run typecheck --prefix kai-ui-web
      - run: npm test --prefix kai-ui-web
      - run: npm run build --prefix kai-ui-web

  desktop:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: kai-ui-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kai-ui-desktop
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # Pure tests only: no window, GPU surface or clipboard access.
      - run: cargo test --locked
      # Experimental MCP server (13, Paso 12): in-process client over a pipe.
      - run: cargo clippy --locked --all-targets --features mcp -- -D warnings
      - run: cargo test --locked --features mcp
      # Mini Word editor (docs/dev/16): WordCraft, off by default.
      - run: cargo clippy --locked --all-targets --features document -- -D warnings
      - run: cargo test --locked --features document
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # An app outside the crate that only uses the public API.
      - run: cargo check --locked --manifest-path fixtures/external-app/Cargo.toml --target-dir target
      # An app built from src/sections by kai-build (docs/dev/26, R4).
      - run: cargo clippy --locked --all-targets --manifest-path fixtures/sections-app/Cargo.toml --target-dir target -- -D warnings
      - run: cargo test --locked --manifest-path fixtures/sections-app/Cargo.toml --target-dir target

  # Root of an app from its folders (docs/dev/26, R4).
  kai-build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: kai-build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # `kai dev` and the rest of the CLI (13, Paso 18).
  kai-cli:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: kai-cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kai-cli
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  desktop-msrv:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: kai-ui-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kai-ui-desktop
      - run: cargo check --locked --all-targets

  # Windows probe (#10): the crate keeps compiling for MSVC. Check only:
  # no tests, no window, no GPU. A native runner rather than cargo-xwin on
  # Linux: `ring` (ureq → rustls, default `net` feature) builds its C code
  # with MSVC, which windows-latest already has.
  desktop-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: kai-ui-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kai-ui-desktop
      - run: cargo check --locked --target x86_64-pc-windows-msvc --all-targets --no-default-features
      # Default features: `net` (images by URL over HTTPS).
      - run: cargo check --locked --target x86_64-pc-windows-msvc --all-targets
