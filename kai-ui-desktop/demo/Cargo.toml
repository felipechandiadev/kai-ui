[package]
name = "kai-demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

# The demo, rewritten as an app built from folders: one per section in
# src/sections, the root generated by kai-build (docs/dev/26, R5). It
# replaces src/demo.rs section by section (docs/dev/27).
[dependencies]
kai = { package = "kai-ui-desktop-prototype", path = "..", features = ["document"] }
# Command inputs (`PageAction: Deserialize + JsonSchema`); same majors as Kai.
schemars = "1"
serde = { version = "1", features = ["derive"] }

[features]
# `--mcp`: the demo's commands over stdio (docs/dev/14-mcp.md).
mcp = ["kai/mcp"]

[dev-dependencies]
# The captures write PNG (tests/snapshots.rs).
kai = { package = "kai-ui-desktop-prototype", path = "..", features = ["document", "snapshots"] }

[build-dependencies]
kai-build = { path = "../../kai-build" }

# As in kai-ui-desktop/Cargo.toml: a patch applies only in the package being
# built, so the demo repeats it (craft-pdf needs this krilla).
[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "c3487320b2d1de657b860b3c8abb44e1f2b32bd8" }

# As in kai-ui-desktop: less debug info and no incremental cache, so the
# shared target/ stays small.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false
