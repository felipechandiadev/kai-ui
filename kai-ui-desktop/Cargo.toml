[package]
name = "kai-ui-desktop-prototype"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

# Library + demo binary (docs/dev/12-modelo-appkit.md, Paso 1). The library is
# `kai` so examples and tests can write `use kai::...`.
[lib]
name = "kai"
path = "src/lib.rs"

[[bin]]
name = "kai-ui-desktop-prototype"
path = "src/main.rs"

[features]
# Enables PNG read/write in `kai::snapshot` outside the crate's own tests.
snapshots = ["dep:png"]
# Experimental MCP server over stdio (`--mcp`, 13 Paso 12).
mcp = ["dep:rmcp", "dep:tokio"]
# Images by URL (`ImageSource::Url`) with a blocking HTTPS client on the
# task pool; without it those images fail with a message.
net = ["dep:ureq"]
default = ["net"]

[dependencies]
accesskit = "0.25.1"
accesskit_winit = { version = "0.34.1", default-features = false, features = ["rwh_06"] }
arboard = { version = "3.7.0", default-features = false }
bytemuck = { version = "1.25", features = ["derive"] }
# Gzip of PMTiles directories and map tiles (`kai::maps::pmtiles`).
flate2 = "1.1"
# Geometries as `mvt-reader` returns them.
geo-types = { version = "0.7", default-features = false }
# Polygons of map layers (`kai::maps::layers`).
geojson = { version = "1", default-features = false }
glyphon = "0.12.0"
# Decoding of `kai::media` images (PNG, JPEG, WebP), off the UI thread.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Fill and stroke meshes for `DrawOp::Geometry` (maps, vector shapes).
lyon_tessellation = "1"
# Mapbox Vector Tiles of the basemap (`kai::maps::mvt`).
mvt-reader = { version = "2.5", default-features = false }
pollster = "0.4"
png = { version = "0.18.1", optional = true }
cosmic-text = "0.19.0"
resvg = { version = "0.48.1", default-features = false }
# Excel files of a table's rows (`kai::xlsx`, MIT/Apache-2.0, MSRV 1.88).
rust_xlsxwriter = { version = "0.101", default-features = false }
# Command inputs and outputs as JSON, described with JSON Schema 2020-12
# (`kai::commands`, 13 Paso 11).
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# MCP SDK (13 §12: MSRV 1.88, Apache-2.0, stdio server) and the runtime of
# its service thread; only with the `mcp` feature.
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"], optional = true }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "io-std", "io-util"], optional = true }
ureq = { version = "3", optional = true }
taffy = { version = "0.15.0", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "content_size"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "metal", "wgsl"] }
winit = { version = "0.30.12", default-features = false, features = ["rwh_06"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The native menu bar (`kai::menu`). 0.19 is the last release for Rust 1.89
# and shares objc2 0.6 / objc2-app-kit 0.3 with winit.
muda = { version = "0.19.3", default-features = false }
# `NSProcessInfo.operatingSystemVersion` for `AppKitGeneration::current()`;
# already in Cargo.lock through wgpu/winit.
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSArray", "NSString", "NSURL"] }
# `NSOpenPanel` for `Effects::pick_file` (`src/platform/file_panel.rs`) and
# the accessibility preferences of `NSWorkspace` (`src/platform/prefs.rs`);
# both already in Cargo.lock through winit and muda.
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAccessibility", "NSApplication", "NSOpenPanel", "NSPanel", "NSResponder", "NSSavePanel", "NSWindow", "NSWorkspace"] }

[dev-dependencies]
png = "0.18.1"
