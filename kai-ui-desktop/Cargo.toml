[package]
name = "kai-ui-desktop-prototype"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
accesskit = "0.25.1"
accesskit_winit = { version = "0.34.1", default-features = false, features = ["rwh_06"] }
arboard = { version = "3.7.0", default-features = false }
bytemuck = { version = "1.25", features = ["derive"] }
glyphon = "0.12.0"
pollster = "0.4"
cosmic-text = "0.19.0"
resvg = { version = "0.48.1", default-features = false }
taffy = { version = "0.15.0", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "content_size"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "metal", "wgsl"] }
winit = { version = "0.30.12", default-features = false, features = ["rwh_06"] }
