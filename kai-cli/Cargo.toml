[package]
name = "kai-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Herramientas de desarrollo de Kai (13, Paso 18): por ahora `kai dev`."

[[bin]]
name = "kai"
path = "src/main.rs"

# Only JSON: `cargo metadata` and `cargo build --message-format=json`. The
# arguments are parsed by hand and the watcher polls modification times.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
