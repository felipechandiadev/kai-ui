[package]
name = "kai-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Herramientas de desarrollo de Kai (13, Pasos 17–19): kai.toml, doctor, test, new, icons, dev, bundle."

[[bin]]
name = "kai"
path = "src/main.rs"

# JSON de cargo + TOML del manifiesto. Sin clap ni notify: args a mano, watcher por mtime.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Same folder checks as the build of an app made of sections (docs/dev/26).
kai-build = { path = "../kai-build" }
